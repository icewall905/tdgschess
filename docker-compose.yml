services:
  chess-arena:
    build: .
    container_name: chess-arena
    restart: unless-stopped
    stop_grace_period: 20s  # time to save running games before a force-kill
    ports:
      - "8765:8000"
    environment:
      # OpenAI-compatible endpoints, "name=url" comma separated.
      - ENDPOINTS=${ENDPOINTS}
      - LLM_API_KEY=${LLM_API_KEY:-none}
      - MAX_PLIES=${MAX_PLIES:-400}
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 3G  # several Stockfish processes (eval bar, hints, teacher, one per game) at ~100-300 MB each
