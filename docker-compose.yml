services:
  chess-arena:
    build: .
    container_name: chess-arena
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      # OpenAI-compatible endpoints, "name=url" comma separated.
      - ENDPOINTS=${ENDPOINTS}
      - LLM_API_KEY=${LLM_API_KEY:-none}
      - MAX_PLIES=${MAX_PLIES:-400}
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1G
